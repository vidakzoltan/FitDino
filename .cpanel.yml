---
deployment:
  tasks:
    - export DEPLOYPATH=/home/zenitpr1/public_html/webapps/fitdino/
    - /bin/mkdir -p "$DEPLOYPATH"
    - >
      /bin/rsync -av --delete --delete-after
      --exclude='.git/'
      --exclude='.github/'
      --exclude='*.zip'
      --exclude='*.yml'
      --exclude='*.yaml'
      --exclude='*.csv'
      --exclude='*.md'
      --exclude='*.sql'
      --exclude='uploads/'
      --exclude='_backup/'
      --exclude='backup/'
      --exclude='backups/'
      --exclude='tmp/'
      --exclude='cache/'
      --exclude='logs/'
      ./
      "$DEPLOYPATH/"
    - /usr/bin/find "$DEPLOYPATH" -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find "$DEPLOYPATH" -type f -exec /bin/chmod 644 {} +
