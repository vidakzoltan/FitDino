name: FitDino code audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/game.js
          node --check assets/js/tatami.js
          node --check assets/js/privacy-notice.js
          node --check assets/js/fitdino/constants.js
          node --check assets/js/fitdino/utils.js
          node --check assets/js/fitdino/renderer.js
      - name: Run regression checks
        run: |
          sh -n scripts/configure-directory-index.sh
          node --test tests/*.test.cjs
